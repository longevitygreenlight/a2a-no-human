<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agent Storefront</title>
<style>
body{margin:0;background:#f1ece4;font:16px/1.55 system-ui,sans-serif;color:#111827}
.card{max-width:520px;margin:22px auto;background:#fffdfa;border-radius:20px;padding:30px}
.eyebrow{color:#7c3aed;font-weight:800;letter-spacing:.15em;font-size:13px}
h1{font-size:40px;margin:8px 0 16px;letter-spacing:-.02em}
p.sub{color:#4b5563;margin:0 0 24px}
label{display:block;font-weight:800;margin:20px 0 8px}
input{width:100%;box-sizing:border-box;padding:15px 16px;border:1px solid #d1d5db;border-radius:14px;font-size:16px}
button{width:100%;margin-top:24px;padding:17px;border:0;border-radius:999px;background:#1f2937;color:#fff;font-size:17px;font-weight:800}
#go:disabled{background:#c7cbd1;color:#f3f4f6;cursor:not-allowed}
.rainbow{margin-top:18px;font-size:23px;font-weight:800;text-align:center}
#out{margin-top:22px;font-size:15px}

/* password field + eye toggle */
.pwwrap{position:relative}
.pwwrap input{padding-right:52px}
#eye{position:absolute;top:50%;right:6px;transform:translateY(-50%);width:40px;height:40px;margin:0;padding:0;background:none;border:0;border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer}
#eye svg{width:22px;height:22px;stroke:#6b7280;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}
#eye .slash{display:none}
#eye.hidden .slash{display:inline}

/* error state */
#passlabel.err{color:#dc2626}
#pass.err{border:2px solid #dc2626;background:#fef2f2}
#pass.err::placeholder{color:#dc2626}
#eye.err svg{stroke:#dc2626}
#out.err{color:#dc2626;font-weight:800}

/* optional email block - hidden until the three required fields are filled */
#emailblock{display:none;margin-top:4px}
#emailblock.show{display:block}
#emaillabel{color:#4b5563}
#emaillabel .opt{color:#7c3aed;font-weight:800}
</style>
<div class="card">
<div class="eyebrow">BUYER AGENT</div>
<h1>Agent Storefront</h1>
<p class="sub">Super excited to shop the open registry for you.<br>I will gladly &mdash; find it, judge it, and buy it. ps: Just for you....</p>
<label for="want">What would you like me to buy?</label>
<input id="want" placeholder="fix the habits ruining my deep sleep">
<label for="cap">What is the maximum you want to spend in USD?</label>
<input id="cap" type="text" inputmode="decimal" placeholder="1" autocomplete="off">
<label for="pass" id="passlabel">Password</label>
<div class="pwwrap">
<input id="pass" type="text" placeholder="" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
<button id="eye" type="button" aria-label="Hide password">
<svg viewBox="0 0 24 24"><path d="M1.8 12S5.4 5.4 12 5.4 22.2 12 22.2 12 18.6 18.6 12 18.6 1.8 12 1.8 12Z"/><circle cx="12" cy="12" r="3.2"/><line class="slash" x1="4" y1="20" x2="20" y2="4"/></svg>
</button>
</div>
<div id="emailblock">
<label for="email" id="emaillabel"><span class="opt">Optional</span> &mdash; receive email for successful purchase....</label>
<input id="email" type="email" placeholder="you@example.com" autocomplete="email" autocapitalize="off" autocorrect="off" spellcheck="false">
</div>
<button id="go" disabled>Send my agent shopping</button>
<div class="rainbow"><span style="color:#0e7490">Something</span> <span style="color:#c084fc">good</span> <span style="color:#f472b6">is</span> <span style="color:#fb7185">coming</span> <span style="color:#ca8a04">my</span> <span style="color:#166534">way</span></div>
<div id="out"></div>
</div>
<script>
const out=document.getElementById('out');
const passInput=document.getElementById('pass');
const passLabel=document.getElementById('passlabel');
const eye=document.getElementById('eye');

// eye with no line across = password readable; line across = dots
eye.onclick=function(){
  const hide = passInput.type === 'text';
  passInput.type = hide ? 'password' : 'text';
  eye.classList.toggle('hidden', hide);
  eye.setAttribute('aria-label', hide ? 'Show password' : 'Hide password');
};

function clearErr(){
  passInput.classList.remove('err');
  passLabel.classList.remove('err');
  eye.classList.remove('err');
  out.classList.remove('err');
}
const go=document.getElementById('go');
const wantInput=document.getElementById('want');
const capInput=document.getElementById('cap');
const emailBlock=document.getElementById('emailblock');
const emailInput=document.getElementById('email');
function syncGo(){
  const ready = wantInput.value.trim()!=='' && capInput.value.trim()!=='' && passInput.value.trim()!=='';
  go.disabled = !ready;
  emailBlock.classList.toggle('show', ready);
  if(!ready) emailInput.value='';
}
wantInput.oninput = syncGo;
capInput.oninput = function(){
  // digits and one decimal point only
  let v = capInput.value.replace(/[^0-9.]/g,'');
  const i = v.indexOf('.');
  if(i !== -1) v = v.slice(0,i+1) + v.slice(i+1).replace(/\./g,'');
  capInput.value = v;
  syncGo();
};
passInput.oninput = function(){ clearErr(); syncGo(); };
syncGo();

go.onclick=async()=>{
clearErr();
out.textContent='Something good is coming your way\u2026';
let d;
try{
  const r=await fetch('/buy',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({want:want.value,cap:cap.value||'1',pass:passInput.value.trim(),email:emailInput.value.trim()})});
  d=await r.json();
}catch(e){
  out.classList.add('err');
  out.innerHTML='<b>Could not reach the agent. Try again.</b>';
  return;
}
if(d.error && /password/i.test(d.error)){
  passInput.classList.add('err');
  passLabel.classList.add('err');
  eye.classList.add('err');
  out.classList.add('err');
}
out.innerHTML=d.error?'<b>'+d.error+'</b>':d.play_url?'<b>Yay! Found it. Bought it. And it\'s yours.</b><br><br><a href="'+d.play_url+'">Delivery of '+want.value+'</a>'+(d.emailed_to?'<br><br>Sent to '+d.emailed_to:'')+(d.support?'<br><br>Feel free to contact me, even if its to tell me how well you slept!<br><a href="'+d.support+'">WhatsApp me</a><br><br><b>Sweet deep sleep &mdash; where your body has it to itself.<br>The repair workshop opens.<br>Look forward to waking up.</b>':''):'<b>Nothing found &mdash; And hey I wasn\'t going to spend your money badly. That\'s a win too.</b>';
};
</script>
